[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Plugin modules obtain Qt classes through Krita's wildcard exports.
"dockerundercursor/*.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["dockerundercursor"]
